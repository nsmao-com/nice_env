[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/core", "crates/platform"]

[workspace.package]
edition = "2021"
version = "0.2.11"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "blocking", "json", "multipart"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
tempfile = "3"
base64 = "0.22"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
