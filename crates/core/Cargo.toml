[package]
name = "nsb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
platform = { path = "../platform" }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = "0.42.0"
yaml_serde = "0.10.7"
# 复用 yaml_serde 已有的解析器，获取配置值的源码位置以保留注释和布局。
libyaml-rs = "0.3.0"
# 与 r-nacos 上游使用同一解析器，预检时不改变父进程环境。
dotenv = "0.15.0"
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }
sevenz-rust = { workspace = true }
# 复用锁文件已有的 gzip 实现，流式校验及提取 MongoDB 官方归档。
flate2 = "1.1.10"
tar = "0.4.44"
rusqlite = { workspace = true }
sysinfo = { workspace = true }
rcgen = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
bcrypt = "0.19.3"
futures-util = "0.3"
time = "0.3"
p256 = { version = "0.14.0", features = ["ecdsa", "pem"] }
hmac = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
russh-sftp = "3.0.0"
rsa = { version = "0.9.10", features = ["pem"] }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
# 复用原 p12-keystore 已引入的编码/加密库，直接控制可选别名和 UTF-16 密码。
pkcs12 = { version = "0.2.0-pre.0", features = ["kdf"] }
pkcs5 = { version = "0.8", features = ["alloc", "pbes2"] }
sha2_11 = { package = "sha2", version = "0.11" }
tokio-rustls = "0.26.5"
rustls = { version = "0.23.45", features = ["ring"] }
x509-parser = "0.18.1"
jks = { version = "0.3.3", default-features = false, features = ["rand"] }
# 证书到期通知邮件（certdeploy.rs 的 AsyncSmtpTransport relay/starttls_relay）
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-native-tls",
] }

[dev-dependencies]
tempfile = { workspace = true }
p12-keystore = "0.3.2"
