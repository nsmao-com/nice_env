name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # 手动重跑必须填写已经推送的 tag，检查和打包都使用该 tag 的代码。
    inputs:
      tag:
        description: "要发布的版本 tag（例如 v0.2.1），须与 tauri.conf.json 的版本号一致"
        required: true
        type: string

permissions:
  contents: write

# 同一 tag 的重复触发排队执行，避免并发替换 Release 附件时出现 404。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-platforms:
    name: Verify runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-core-${{ matrix.os }}
      - name: Verify core and platform before publishing installers
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          cargo test --locked -p nsb-core -p platform --no-fail-fast -- --test-threads=1 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failed_tests=$(grep -E '^test .* \.\.\. FAILED$' "$log_file" | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | paste -sd ';' -)
            if [ -z "$failed_tests" ]; then
              failed_tests=$(grep -A8 '^failures:' "$log_file" | sed -n '2,8p' | paste -sd ';' -)
            fi
            failed_tests=${failed_tests:-"未能从测试输出提取失败用例，请查看该步骤日志"}
            echo "::error title=macOS 平台测试失败::$failed_tests"
          fi
          rm -f "$log_file"
          exit "$status"
      - name: Verify official Windows NATS with persistent data
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        env:
          NSB_SKIP_HOSTS: "1"
          NSB_NATIVE_PACKAGE: nats
        run: cargo test --locked -p nsb-core --lib install::tests::official_package_lifecycle -- --exact --ignored --nocapture --test-threads=1
      - name: Verify official macOS packages with native binaries
        if: runner.os == 'macOS'
        # 官方套件生命周期验证依赖上游二进制和 macOS runner 的即时状态；
        # 失败时保留警告，但不能阻断 ACME/核心修复版本的安装包发布。
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        env:
          NSB_SKIP_HOSTS: "1"
        run: |
          status=0
          for package in mysql mongodb mihomo nats go node mongosh mongodb-database-tools composer; do
            if ! NSB_NATIVE_PACKAGE="$package" cargo test --locked -p nsb-core --lib install::tests::official_package_lifecycle -- --exact --ignored --nocapture --test-threads=1; then
              echo "::warning title=macOS 原生套件验证失败::$package（不阻断安装包发布）"
              status=1
            fi
          done
          exit "$status"

  release:
    name: Build & Release (${{ matrix.platform }} ${{ matrix.targets }})
    needs: verify-platforms
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：默认 x86_64-pc-windows-msvc，只出 NSIS 安装包
          # （tauri.conf.json 的 bundle.targets 里 app/dmg 会被 bundler 按平台过滤掉）
          - platform: windows-latest
            args: "--bundles nsis"
            targets: ""
          # macOS 双架构：aarch64 与 x86_64 各出一套 .app + .dmg
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: "x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 锁文件是 pnpm 10 的 lockfileVersion 9.0；package.json 无 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # tag 与应用版本号不一致时直接失败：Release 标题与安装包文件名取自
      # tauri.conf.json 的版本号，不一致会发出「tag 是 v0.2.0、内容却是 0.1.0」的包。
      - name: Verify tag matches app version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          git fetch --no-tags origin "refs/tags/$TAG"
          if [ "$(git cat-file -t FETCH_HEAD)" != tag ] || [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]; then
            echo "::error title=发布标签不一致::远程必须存在指向当前构建提交的 annotated tag，不能由安装包任务临时创建或移动标签"
            exit 1
          fi
          ver=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$ver" ]; then
            echo "::error title=版本号不一致::tag 为 $TAG，但 tauri.conf.json 的版本号是 $ver（应为 v$ver）"
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json', 'apps/desktop/package.json', 'apps/web/package.json', 'packages/schema/package.json']) {
            const { version } = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (`v${version}` !== process.env.TAG) throw new Error(`${file} 的版本 ${version} 与 ${process.env.TAG} 不一致`);
          }
          NODE

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Windows 矩阵项为空字符串（等价于不装额外 target）
          targets: ${{ matrix.targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # 两个 macOS 矩阵项共享同一把 key 会互相覆盖缓存，按 target 区分
          key: ${{ matrix.targets || 'host' }}

      # tauri-action 会自己执行 tauri.conf.json 的 beforeBuildCommand
      # （`pnpm --filter @nsb/web build`），所以必须先把工作区依赖装好。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tauri 工程在 apps/desktop，tauri.conf.json 位于其 src-tauri 下
          projectPath: apps/desktop
          # 工作区 tauri 脚本先按 --target 编译 CLI/MCP，并注入 externalBin 后再打包。
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag || github.ref_name }}
          # tag 已验证并固定到构建提交，API 的 target_commitish 不用于移动既有 tag。
          # 若传历史 SHA，而 main 在构建期间改过 workflow，GitHub 会额外要求
          # GITHUB_TOKEN 无法获得的 workflows:write，导致出包后创建 Release 403。
          releaseCommitish: ${{ github.event.repository.default_branch }}
          releaseName: "NiceEnv v__VERSION__"
          releaseBody: |
            自动构建的安装包（v__VERSION__）：

            - Windows：NSIS 安装包（x64，当前用户安装，无需管理员）
            - macOS：`.dmg`（Apple Silicon 与 Intel 各一份）
            - 内含 `nsbctl` 命令行工具与 `nsb-mcp` AI 集成工具

            安装包未做代码签名，Windows SmartScreen / macOS Gatekeeper 可能提示
            来源不明，属预期现象。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # 未接入 Tauri updater 插件（tauri.conf.json 无 plugins.updater），
          # 关闭 latest.json 上传，避免发版时出现「找不到 .sig 签名」的告警。
          includeUpdaterJson: false
