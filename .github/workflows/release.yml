name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已推送的 annotated tag，例如 v2.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  web:
    name: Verify release and build React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - name: Verify remote annotated tag and package versions
        shell: bash
        env: { TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
          node - <<'NODE'
          const fs = require('node:fs');
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.TAG)) throw new Error('Stable tag required');
          for (const file of ['package.json', 'apps/web/package.json', 'apps/desktop/package.json', 'packages/schema/package.json']) {
            if (`v${JSON.parse(fs.readFileSync(file)).version}` !== process.env.TAG) throw new Error(`${file}: version mismatch`);
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nsb/schema check
      - run: pnpm --filter @nsb/web check
      - run: pnpm --filter @nsb/web check:logic
      - run: pnpm --filter @nsb/web build
      - uses: actions/upload-artifact@v5
        with: { name: release-web, path: apps/web/out, if-no-files-found: error }

  package:
    name: Go / Wails (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-15-intel, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v5
        with: { name: release-web, path: apps/web/out }
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - name: Check native command coverage
        shell: bash
        env: { NICEENV_WAILS_HOME: "${{ runner.temp }}/niceenv-check" }
        run: node scripts/wails-port-status.mjs --require-complete
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Package desktop
        run: node scripts/package-desktop.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/release/*_setup.exe
            artifacts/release/*.dmg
            artifacts/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish complete release
    needs: package
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/download-artifact@v5
        with: { pattern: installer-*, path: installers, merge-multiple: true }
      - name: Publish all three platforms together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test -f "installers/NiceEnv_${version}_windows_amd64_setup.exe"
          test -f "installers/NiceEnv_${version}_macos_amd64.dmg"
          test -f "installers/NiceEnv_${version}_macos_arm64.dmg"
          (cd installers && sha256sum -c *.sha256)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "NiceEnv $TAG" --notes 'Go + Wails v3 desktop. Includes nsbctl and nsb-mcp. Windows x64 and macOS Intel / Apple Silicon. Installers are not signed with a commercial signing certificate.'
          fi
          gh release upload "$TAG" installers/* --clobber
          gh release edit "$TAG" --draft=false --latest
