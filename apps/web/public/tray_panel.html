<!doctype html>
<!--
  NiceEnv 托盘面板（仿搜狗输入法托盘弹窗的卡片式风格）
  ------------------------------------------------------------
  自包含 HTML/CSS/JS，无框架无外部资源，由托盘小窗（tray-panel）加载：
  - dev 模式走 Next dev server（public/ 直接伺服）；
  - 打包后走 Tauri 资产协议（static export 时 public/ 拷进 out/）。
  与 Rust 的约定：
  - invoke `tray_panel_state` 拉初始数据；listen `tray://state` 收增量推送；
  - 动作复用主窗口命令（start_service / start_stack / open_in_browser …），
    托盘特有动作用 tray_open_main / tray_stop_all / tray_panel_resize / tray_panel_hide；
  - 渲染完成后按内容高度 invoke `tray_panel_resize` 自适应窗口高度。
  直接用浏览器打开本文件（无 __TAURI__）自动进入 mock 预览：
  #demo=quiet | #demo=busy | #demo=dark
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NiceEnv</title>
<style>
  :root {
    --panel-bg: #eef0f4;
    --card: #ffffff;
    --txt: #1b2027;
    --txt-2: #8a919e;
    --txt-3: #c3c9d1;
    --hover: #f4f5f8;
    --line: #d5dbe3;
    --chip: #f4f5f8;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #e5484d;
    --shadow: 0 24px 64px -12px rgba(15, 23, 42, .30), 0 6px 18px rgba(15, 23, 42, .14);
  }
  [data-theme="dark"] {
    --panel-bg: #1d1f24;
    --card: #292c33;
    --txt: #e8eaee;
    --txt-2: #9aa0ab;
    --txt-3: #5b616b;
    --hover: #33363e;
    --line: #4c5360;
    --chip: #33363e;
    --shadow: 0 24px 64px -12px rgba(0, 0, 0, .55), 0 6px 18px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    color: var(--txt);
    user-select: none;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    height: 100%;
    padding: 8px;
    background: var(--panel-bg);
    border: 1px solid rgba(15, 23, 42, .07);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow-y: auto;
    scrollbar-width: none;
  }
  [data-theme="dark"] .panel { border-color: rgba(255, 255, 255, .06); }
  .panel::-webkit-scrollbar { display: none; }
  .wrap { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    overflow: hidden;
  }

  /* ---- 抬头卡：logo + 名称 + 运行状态 ---- */
  .head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .head:hover { background: var(--hover); }
  .logo {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: #277b69;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .20);
  }
  .logo svg { width: 23px; height: 23px; color: #fff; }
  .head-name { font-size: 16px; font-weight: 600; letter-spacing: .2px; line-height: 1.25; }
  .head-sub { font-size: 12px; color: var(--txt-2); margin-top: 1px; overflow-wrap: anywhere; }
  .head > div:nth-child(2) { min-width: 0; }
  .head-status {
    margin-left: auto; flex: none;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--txt-2); max-width: 46%;
    padding: 4px 10px; border-radius: 999px; background: var(--chip);
  }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--txt-3); }
  .dot.running { background: var(--green); box-shadow: 0 0 0 3px rgba(34, 197, 94, .16); }
  .dot.error { background: var(--red); box-shadow: 0 0 0 3px rgba(229, 72, 77, .14); }
  .dot.busy { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }

  /* ---- 快捷宫格卡 ---- */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; }
  .qa {
    appearance: none; border: 0; background: none; font: inherit; color: var(--txt);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 0 9px; border-radius: 10px; cursor: pointer;
  }
  .qa:hover { background: var(--hover); }
  .qa:active { transform: scale(.96); }
  .qa svg { width: 22px; height: 22px; color: #404651; }
  [data-theme="dark"] .qa svg { color: #c7ccd4; }
  .qa .cap { font-size: 11.5px; color: var(--txt-2); padding: 0; letter-spacing: 0; white-space: nowrap; }
  .qa[disabled] { cursor: default; }
  .qa[disabled]:hover { background: none; }
  .qa[disabled]:active { transform: none; }
  .qa[disabled] svg { color: var(--txt-3); }
  .qa[disabled] .cap { color: var(--txt-3); }
  .qa.busy svg { animation: spin 1s linear infinite; }
  .qa.busy .cap::after { content: "…"; }

  /* ---- 列表卡 ---- */
  .cap { font-size: 11px; color: var(--txt-2); padding: 11px 14px 5px; letter-spacing: .4px; }
  .row {
    appearance: none; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left;
    display: flex; align-items: center; gap: 11px;
    height: 42px; padding: 0 14px; font-size: 13.5px;
  }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--hover); }
  .row.disabled { color: var(--txt-3); }
  .row.disabled .ric { color: var(--txt-3); }
  .ric { flex: none; width: 19px; height: 19px; color: #565d68; display: grid; place-items: center; }
  [data-theme="dark"] .ric { color: #b6bcc6; }
  .ric svg { width: 19px; height: 19px; }
  .rlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmeta { flex: none; font-size: 11.5px; color: var(--txt-2); font-family: ui-monospace, Consolas, monospace; }
  .chev { flex: none; width: 15px; height: 15px; color: var(--txt-3); }
  .sep { height: 0; border-top: 1px dashed var(--line); margin: 6px 14px; }
  .row.danger { color: var(--red); }
  .row.danger .ric { color: var(--red); }
  .row.danger.click:hover { background: rgba(229, 72, 77, .08); }
  .empty { padding: 4px 14px 13px; font-size: 12px; color: var(--txt-3); }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--green); outline-offset: -3px; }
  .feedback { padding: 12px 14px; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
  .feedback[hidden], .load-error[hidden] { display: none; }
  .feedback p { margin: 4px 0; color: var(--txt-2); }
  .feedback ul { max-height: 180px; overflow: auto; padding-left: 18px; margin: 6px 0; user-select: text; }
  .feedback .error { color: var(--red); }
  .feedback-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .small-button { border: 1px solid var(--line); background: var(--chip); color: var(--txt); border-radius: 7px; padding: 6px 9px; font: inherit; cursor: pointer; }
  .small-button:disabled { opacity: .5; cursor: default; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 340px) { .head { gap: 8px; padding: 12px; } .head-status { font-size: 11px; padding: 4px 7px; } .logo { width: 34px; height: 34px; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy, .qa.busy svg { animation: none; } .qa:active { transform: none; } }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="wrap" id="wrap">
    <header class="card head" id="headCard" role="button" tabindex="0" aria-label="打开 NiceEnv 主窗口">
      <div class="logo" id="logoBox"></div>
      <div>
        <div class="head-name">NiceEnv</div>
        <div class="head-sub" id="headSub">本地开发环境</div>
      </div>
      <div class="head-status"><span class="dot" id="headDot"></span><span id="headStatus">—</span></div>
    </header>

    <section class="card quick" id="quickCard"></section>
    <section class="card feedback load-error" id="loadError" role="alert" hidden></section>
    <section class="card feedback" id="feedback" role="status" aria-live="polite" tabindex="-1" hidden></section>
    <section class="card" id="envCard"></section>
    <section class="card" id="navCard"></section>
  </div>
</main>

<script>
"use strict";

/* ================= 基建 ================= */

const TAURI = !!(window.__TAURI__ && window.__TAURI__.core);
const inv = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const svg = (inner, fill) =>
  `<svg viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

const ICONS = {
  logo: svg('<rect x="4" y="5" width="16" height="6" rx="2"/><rect x="4" y="13" width="16" height="6" rx="2"/><path d="M7.6 8h.01M7.6 16h.01"/>'),
  play: svg('<path d="M8 5.9v12.2c0 .8.88 1.29 1.56.86l9.9-6.1a1.02 1.02 0 0 0 0-1.72l-9.9-6.1A1.02 1.02 0 0 0 8 5.9z"/>', true),
  stop: svg('<rect x="6.4" y="6.4" width="11.2" height="11.2" rx="2.6"/>', true),
  refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
  window: svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9h17"/><path d="M6.6 6.8h.01M9.2 6.8h.01"/>'),
  globe: svg('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.3 3.8 5.2 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5.2-3.8-8.5s1.3-6.2 3.8-8.5z"/>'),
  db: svg('<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-13"/><path d="M4.5 12c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>'),
  code: svg('<path d="M8.5 7.5 4 12l4.5 4.5"/><path d="M15.5 7.5 20 12l-4.5 4.5"/>'),
  layers: svg('<path d="m12 3 8.5 4.8L12 12.6 3.5 7.8 12 3z"/><path d="m3.5 12.4 8.5 4.8 8.5-4.8"/><path d="m3.5 16.6 8.5 4.8 8.5-4.8"/>'),
  terminal: svg('<path d="m5 7 5 5-5 5"/><path d="M12.5 17H19"/>'),
  grid: svg('<rect x="3.5" y="3.5" width="7.4" height="7.4" rx="2"/><rect x="13.1" y="3.5" width="7.4" height="7.4" rx="2"/><rect x="3.5" y="13.1" width="7.4" height="7.4" rx="2"/><rect x="13.1" y="13.1" width="7.4" height="7.4" rx="2"/>'),
  pkg: svg('<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>'),
  file: svg('<path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8L14 3.5z"/><path d="M14 3.5V8h4.5"/><path d="M9 12.5h6M9 16h6"/>'),
  sliders: svg('<path d="M4 7h7.5M16.5 7H20"/><circle cx="14" cy="7" r="2.2"/><path d="M4 12h2.5M11.5 12H20"/><circle cx="9" cy="12" r="2.2"/><path d="M4 17h7.5M16.5 17H20"/><circle cx="14" cy="17" r="2.2"/>'),
  folder: svg('<path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17v-10.5z"/>'),
  info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 7.6h.01"/>'),
  power: svg('<path d="M12 3.5v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>'),
  chev: svg('<path d="m9.5 6 6 6-6 6"/>'),
};
const GROUP_ICONS = [ICONS.globe, ICONS.code, ICONS.db, ICONS.layers, ICONS.terminal];

/* ================= 渲染 ================= */

let S = null;
const busy = new Set();
let result = null;
let actionError = "";
let loadError = "";
let stateRevision = 0;
const hasProcess = (s) => !!s.pids?.length || ["running", "starting", "stopping"].includes(s.state);
const transitioning = (s) => ["starting", "stopping"].includes(s.state);
const startTargets = () => (S?.services || []).filter((s) => !hasProcess(s)).map((s) => s.id);
const nameOf = (id) => (S?.services || []).find((s) => s.id === id)?.label || (id === "adminer-console" ? "数据库管理台" : id);
const errorText = (e) => {
  if (typeof e === "string") { try { return errorText(JSON.parse(e)); } catch { return e; } }
  return [e?.message || "操作失败，请重试", e?.hint].filter(Boolean).join("；");
};
const stateText = (s) => ({running:"运行中", stopped:"已停止", starting:"正在启动", stopping:"正在停止", error:hasProcess(s) ? "发生错误，仍有进程" : "发生错误", unknown:"状态未知"}[s.state] || "状态未知");

function theme() {
  const a = S?.appearance;
  return a === "dark" || a === "light" ? a : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function renderFeedback() {
  $("loadError").hidden = !loadError;
  $("loadError").innerHTML = loadError ? `<strong>状态读取失败</strong><p>${esc(loadError)}</p><button class="small-button" id="retryLoad">重新读取</button>` : "";
  if ($("retryLoad")) $("retryLoad").onclick = () => void refreshState();
  const panel = $("feedback");
  panel.hidden = !result && !actionError && !busy.size;
  panel.innerHTML = `${busy.size ? '<strong>正在处理服务，请稍候…</strong>' : ""}
    ${actionError ? `<p class="error">${esc(actionError)}</p>` : ""}
    ${result ? `<strong>${esc(result.title)}</strong><p>${esc(result.summary)}</p>
      ${result.failed.length ? `<ul aria-label="失败服务">${result.failed.map((f) => `<li>${esc(nameOf(f.serviceId))}：${esc(errorText(f.error))}</li>`).join("")}</ul>` : ""}
      ${result.skipped.length ? `<p>未安装或不可用：${result.skipped.map((id) => esc(nameOf(id))).join("、")}</p>` : ""}
      <div class="feedback-actions">${result.retry ? `<button class="small-button" id="retryAction" ${busy.size || loadError ? "disabled" : ""}>${esc(result.retry.label)}</button>` : ""}
      ${result.failed.length ? '<button class="small-button" data-key="nav:/logs">查看日志</button>' : ""}
      ${result.skipped.length ? '<button class="small-button" data-key="nav:/packages">安装套件</button>' : ""}</div>` : ""}`;
  if ($("retryAction")) $("retryAction").onclick = () => { const retry = result.retry; void runServiceOperation(retry.key, retry.command, retry.args); };
}

function render() {
  const focusedId = document.activeElement?.id;
  const focusedKey = document.activeElement?.dataset?.key;
  document.documentElement.dataset.theme = theme();
  renderFeedback();
  if (!S) { requestAnimationFrame(syncHeight); return; }
  $("headSub").textContent = TAURI ? `v${S.version}` : "浏览器演示 · 不操作本机服务";
  const all = S.services || [];
  const active = all.filter(hasProcess).length;
  const running = all.filter((s) => s.state === "running").length;
  const errors = all.filter((s) => s.state === "error" || s.state === "unknown").length;
  $("headDot").className = `dot ${loadError || errors ? "error" : running ? "running" : active ? "busy" : ""}`;
  $("headStatus").textContent = loadError ? "状态待确认" : !all.length ? "尚未安装服务"
    : errors ? `${running} 个运行 · ${errors} 个需检查` : running ? `${running}/${all.length} 个运行中`
    : active ? `${active} 个仍有进程或正在切换` : `全部已停止（${all.length}）`;
  const locked = busy.size > 0 || !!loadError;
  const qa = (id, icon, cap, on, busyKey) => `<button type="button" class="qa${busy.has(busyKey) ? " busy" : ""}" id="${id}"${on ? "" : " disabled"}>${icon}<span class="cap">${cap}</span></button>`;
  $("quickCard").innerHTML =
    qa("qaStart", ICONS.play, "启动全部", startTargets().length > 0 && !locked, "start-all") +
    qa("qaStop", ICONS.stop, "停止全部", !locked, "stop-all") +
    qa("qaWindow", ICONS.window, "主窗口", true, "") + qa("qaUpdate", ICONS.refresh, "检查更新", true, "");
  let env = "";
  if (S.stacks?.length) {
    env += '<div class="cap">服务栈</div>';
    env += S.stacks.map((k) => row({key:"stack:" + k.id, icon:ICONS.play, label:k.name,
      meta:`${k.running}/${k.total} 运行中`, disabled:locked, dot:busy.has("stack:" + k.id) ? "busy" : k.total > 0 && k.running === k.total ? "running" : ""})).join("");
  }
  if (all.length) {
    if (env) env += '<div class="sep"></div>';
    env += `<div class="cap">服务 · ${all.length}</div>`;
    let group = -1;
    for (const s of all) {
      if (group >= 0 && group !== s.group) env += '<div class="sep"></div>';
      group = s.group;
      env += row({key:"svc:" + s.id, icon:GROUP_ICONS[s.group] || ICONS.terminal, label:s.label,
        meta:s.port ? `:${s.port}` : "", disabled:locked || transitioning(s),
        title:`${s.label} · ${stateText(s)}；${hasProcess(s) ? "停止" : "启动"}服务`,
        dot:transitioning(s) || busy.has("svc:" + s.id) ? "busy" : s.state === "running" ? "running" : s.state === "error" ? "error" : ""});
    }
  } else { env += '<div class="empty">尚未安装服务，请到「套件 / 服务」安装。</div>'; }
  if (S.sites?.length) {
    env += '<div class="sep"></div><div class="cap">站点</div>';
    env += S.sites.map((site) => row({key:"site:" + site.id, icon:ICONS.globe, label:site.name, meta:site.https ? "HTTPS" : "HTTP", chev:true})).join("");
  }
  $("envCard").innerHTML = env;
  const nav = (path, icon, label) => row({key:"nav:" + path, icon, label, chev:true});
  $("navCard").innerHTML = nav("/", ICONS.grid, "总览") + nav("/packages", ICONS.pkg, "套件 / 服务") +
    nav("/stacks", ICONS.layers, "服务栈") + nav("/sites", ICONS.globe, "站点") + nav("/logs", ICONS.file, "日志") +
    '<div class="sep"></div>' + row({key:"act:datadir", icon:ICONS.folder, label:"打开数据目录"}) +
    row({key:"act:about", icon:ICONS.info, label:"关于 NiceEnv"}) + row({key:"act:quit", icon:ICONS.power, label:"退出 NiceEnv", danger:true, disabled:busy.size > 0});
  bind();
  const focusTarget = focusedId ? $(focusedId) : focusedKey ? [...document.querySelectorAll('[data-key]')].find((el) => el.dataset.key === focusedKey) : null;
  if (focusTarget && !focusTarget.disabled) focusTarget.focus({preventScroll:true});
  requestAnimationFrame(syncHeight);
}

function row(o) {
  return `<button type="button" class="row ${o.disabled ? "disabled" : "click"}${o.danger ? " danger" : ""}" data-key="${esc(o.key)}" ${o.disabled ? "disabled" : ""} ${o.title ? `aria-label="${esc(o.title)}" title="${esc(o.title)}"` : ""}>
    <span class="ric" aria-hidden="true">${o.icon}</span><span class="rlabel">${esc(o.label)}</span>
    ${o.meta ? `<span class="rmeta">${esc(o.meta)}</span>` : ""}${o.dot ? `<span class="dot ${o.dot}" aria-hidden="true"></span>` : ""}
    ${o.chev ? `<span class="chev" aria-hidden="true">${ICONS.chev}</span>` : ""}</button>`;
}
function bind() {
  $("headCard").onclick = () => void act("main");
  $("headCard").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); void act("main"); } };
  $("qaStart").onclick = () => void act("start-all");
  $("qaStop").onclick = () => void act("stop-all");
  $("qaWindow").onclick = () => void act("main");
  $("qaUpdate").onclick = () => void act("check-update");
  for (const el of document.querySelectorAll("[data-key]")) el.onclick = () => void act(el.dataset.key);
}

async function runServiceOperation(key, command, args) {
  if (busy.size || loadError) return;
  busy.add(key); actionError = ""; render();
  try {
    const report = TAURI ? await inv(command, args) : await previewCommand(command, args);
    const stop = command.includes("stop");
    const succeeded = report.succeeded || report.started || [];
    const already = report.already || report.alreadyRunning || [];
    const failed = report.failed || [];
    const skipped = report.skipped || [];
    const single = command === "start_service" || command === "stop_service";
    result = {
      title: single ? `${nameOf(args.id)}已${stop ? "停止" : "启动"}` : failed.length || skipped.length ? "部分服务未完成" : `服务${stop ? "停止" : "启动"}操作完成`,
      summary: single ? (TAURI ? "已读取实际操作结果。" : "演示状态已更新，本机服务未改变。") : `成功 ${succeeded.length} · 已在目标状态 ${already.length} · 失败 ${failed.length}`,
      failed, skipped, retry: failed.length ? command === "tray_stop_all"
        ? {key, command, args, label:"再次停止全部"}
        : {key:"retry-action", command:stop ? "bulk_stop" : "bulk_start", args:{ids:failed.map((f) => f.serviceId)}, label:"重试失败项"} : null,
    };
  } catch (error) {
    actionError = errorText(error);
    // 请求失败不代表所有项目未执行，保留上一份报告并重新读取实际状态。
  } finally {
    busy.delete(key);
    await refreshState(); render();
    $("feedback").focus({preventScroll:true});
  }
}

async function act(key) {
  if (key === "start-all") { const ids = startTargets(); if (ids.length) return runServiceOperation(key, "bulk_start", {ids}); return; }
  if (key === "stop-all") return runServiceOperation(key, "tray_stop_all", {});
  if (key.startsWith("svc:")) {
    const service = S?.services.find((s) => s.id === key.slice(4));
    if (service && !transitioning(service)) return runServiceOperation(key, hasProcess(service) ? "stop_service" : "start_service", {id:service.id});
    return;
  }
  if (key.startsWith("stack:")) return runServiceOperation(key, "start_stack", {id:key.slice(6)});
  if (key === "act:quit" && busy.size) return;
  try {
    let command, args;
    if (key === "main" || key === "check-update" || key === "act:about") {
      command = "tray_open_main"; args = {path:null, action:key === "main" ? null : key === "check-update" ? "check-update" : "about"};
    } else if (key.startsWith("nav:")) { command = "tray_open_main"; args = {path:key.slice(4), action:null}; }
    else if (key.startsWith("site:")) { const site = S?.sites.find((s) => s.id === key.slice(5)); if (!site) return; command = "open_in_browser"; args = {url:site.url}; }
    else if (key === "act:datadir") { command = "open_in_folder"; args = {path:S.dataDir}; }
    else if (key === "act:quit") { command = "quit_app"; args = {}; }
    else return;
    if (TAURI) await inv(command, args);
    else { actionError = "浏览器演示仅展示服务操作；此操作请在 NiceEnv 桌面端执行。"; render(); }
  } catch (error) { actionError = errorText(error); render(); $("feedback").focus(); }
}

async function refreshState() {
  const revision = ++stateRevision;
  try {
    if (TAURI) {
      const snapshot = await inv("tray_panel_state", {});
      if (revision !== stateRevision) return;
      S = snapshot;
    }
    else {
      S.running = S.services.filter((s) => s.state === "running").length;
      S.stacks.forEach((stack) => { stack.running = stack.items.filter((id) => S.services.some((s) => s.id === id && s.state === "running")).length; });
    }
    loadError = (S.readErrors || []).join("；");
  } catch (error) { if (revision === stateRevision) loadError = errorText(error); }
  render();
}
function syncHeight() {
  if (TAURI) inv("tray_panel_resize", {height:Math.ceil($("wrap").getBoundingClientRect().height) + 16}).catch(() => {});
}

// 预览只操作当前演示数据，也逐项返回缺失或失败，不声称修改了本机服务。
async function previewCommand(command, args) {
  const stop = command.includes("stop");
  const single = command.endsWith("_service");
  const stack = command === "start_stack" ? S.stacks.find((s) => s.id === args.id) : null;
  if (command === "start_stack" && !stack) throw {message:"找不到服务栈"};
  const ids = [...new Set(single ? [args.id] : stack ? stack.items : args.ids || S.services.map((s) => s.id))];
  const report = {succeeded:[], already:[], failed:[], skipped:[]};
  for (const id of ids) {
    const service = S.services.find((s) => s.id === id);
    if (!service) { if (stack) report.skipped.push(id); else report.failed.push({serviceId:id, error:{message:"服务未注册或已卸载"}}); continue; }
    if (transitioning(service)) { report.failed.push({serviceId:id, error:{message:"服务正在切换状态"}}); continue; }
    if (stop ? !hasProcess(service) : service.state === "running") { if (stop) service.state = "stopped"; report.already.push(id); continue; }
    if (!stop && hasProcess(service)) { report.failed.push({serviceId:id, error:{message:"仍有进程，请先停止服务"}}); continue; }
    service.state = stop ? "stopping" : "starting"; render();
    await new Promise((resolve) => setTimeout(resolve, 350));
    service.state = stop ? "stopped" : "running";
    service.pids = stop ? [] : [Math.floor(Math.random() * 40000) + 1000];
    report.succeeded.push(id);
  }
  if (single && report.failed.length) throw report.failed[0].error;
  return report;
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && TAURI) inv("tray_panel_hide", {}).catch(() => {}); });
document.addEventListener("contextmenu", (e) => e.preventDefault());
$("logoBox").innerHTML = ICONS.logo;
if (TAURI) {
  refreshState();
  window.__TAURI__.event.listen("tray://state", (e) => { stateRevision++; S = e.payload; loadError = (S.readErrors || []).join("；"); render(); })
    .catch((error) => { loadError = `无法订阅状态变化：${errorText(error)}`; render(); });
} else {
  const q = new URLSearchParams(location.hash.replace(/^#\??/, ""));
  const active = q.get("demo") === "busy";
  const svc = (id, label, state, group, port) => ({id, label, state, group, port, pids:state === "running" ? [1000 + group] : []});
  S = { appearance:q.get("demo") === "dark" ? "dark" : "light", dataDir:"演示数据目录",
    services:active ? [svc("nginx", "Nginx", "running", 0, 80), svc("apache", "Apache", "stopped", 0, 8080),
      svc("php@8.3", "PHP 8.3", "running", 1, null), svc("mysql@8.4", "MySQL 8.4", "running", 2, 3306), svc("redis", "Redis", "error", 3, 6379)]
      : [svc("nginx", "Nginx", "stopped", 0, 80)],
    stacks:[{id:"web", name:"Web 开发栈", running:active ? 3 : 0, total:3, items:["mysql@8.4", "php@8.3", "nginx"]}],
    sites:[{id:"demo", name:"我的博客", url:"https://blog.test", https:true}] };
  refreshState();
}
</script>
