<!doctype html>
<!--
  NiceEnv 托盘面板（仿搜狗输入法托盘弹窗的卡片式风格）
  ------------------------------------------------------------
  自包含 HTML/CSS/JS，无框架无外部资源，由托盘小窗（tray-panel）加载：
  - dev 模式走 Next dev server（public/ 直接伺服）；
  - 打包后走 Tauri 资产协议（static export 时 public/ 拷进 out/）。
  与 Rust 的约定：
  - invoke `tray_panel_state` 拉初始数据；listen `tray://state` 收增量推送；
  - 动作复用主窗口命令（start_service / start_stack / open_in_browser …），
    托盘特有动作用 tray_open_main / tray_stop_all / tray_panel_resize / tray_panel_hide；
  - 渲染完成后按内容高度 invoke `tray_panel_resize` 自适应窗口高度。
  直接用浏览器打开本文件（无 __TAURI__）自动进入 mock 预览：
  #demo=quiet | #demo=busy | #demo=dark
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NiceEnv</title>
<style>
  :root {
    --panel-bg: #eef0f4;
    --card: #ffffff;
    --txt: #1b2027;
    --txt-2: #8a919e;
    --txt-3: #c3c9d1;
    --hover: #f4f5f8;
    --line: #f0f1f4;
    --chip: #f4f5f8;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #e5484d;
    --shadow: 0 24px 64px -12px rgba(15, 23, 42, .30), 0 6px 18px rgba(15, 23, 42, .14);
  }
  [data-theme="dark"] {
    --panel-bg: #1d1f24;
    --card: #292c33;
    --txt: #e8eaee;
    --txt-2: #9aa0ab;
    --txt-3: #5b616b;
    --hover: #33363e;
    --line: #33363e;
    --chip: #33363e;
    --shadow: 0 24px 64px -12px rgba(0, 0, 0, .55), 0 6px 18px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    color: var(--txt);
    user-select: none;
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    height: 100%;
    padding: 8px;
    background: var(--panel-bg);
    border: 1px solid rgba(15, 23, 42, .07);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow-y: auto;
    scrollbar-width: none;
  }
  [data-theme="dark"] .panel { border-color: rgba(255, 255, 255, .06); }
  .panel::-webkit-scrollbar { display: none; }
  .wrap { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    overflow: hidden;
  }

  /* ---- 抬头卡：logo + 名称 + 运行状态 ---- */
  .head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .head:hover { background: var(--hover); }
  .logo {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #6366f1, #22d3ee);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 4px 10px -2px rgba(99, 102, 241, .45);
  }
  .logo svg { width: 23px; height: 23px; color: #fff; }
  .head-name { font-size: 16px; font-weight: 600; letter-spacing: .2px; line-height: 1.25; }
  .head-sub { font-size: 12px; color: var(--txt-2); margin-top: 1px; white-space: nowrap; }
  .head-status {
    margin-left: auto; flex: none;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--txt-2);
    padding: 4px 10px; border-radius: 999px; background: var(--chip);
  }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--txt-3); }
  .dot.running { background: var(--green); box-shadow: 0 0 0 3px rgba(34, 197, 94, .16); }
  .dot.error { background: var(--red); box-shadow: 0 0 0 3px rgba(229, 72, 77, .14); }
  .dot.busy { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }

  /* ---- 快捷宫格卡 ---- */
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; }
  .qa {
    appearance: none; border: 0; background: none; font: inherit; color: var(--txt);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 0 9px; border-radius: 10px; cursor: pointer;
  }
  .qa:hover { background: var(--hover); }
  .qa:active { transform: scale(.96); }
  .qa svg { width: 22px; height: 22px; color: #404651; }
  [data-theme="dark"] .qa svg { color: #c7ccd4; }
  .qa .cap { font-size: 11.5px; color: var(--txt-2); }
  .qa[disabled] { cursor: default; }
  .qa[disabled]:hover { background: none; }
  .qa[disabled]:active { transform: none; }
  .qa[disabled] svg { color: var(--txt-3); }
  .qa[disabled] .cap { color: var(--txt-3); }
  .qa.busy svg { animation: spin 1s linear infinite; }
  .qa.busy .cap::after { content: "…"; }

  /* ---- 列表卡 ---- */
  .cap { font-size: 11px; color: var(--txt-2); padding: 11px 14px 5px; letter-spacing: .4px; }
  .row {
    display: flex; align-items: center; gap: 11px;
    height: 42px; padding: 0 14px; font-size: 13.5px;
  }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--hover); }
  .row.disabled { color: var(--txt-3); }
  .row.disabled .ric { color: var(--txt-3); }
  .ric { flex: none; width: 19px; height: 19px; color: #565d68; display: grid; place-items: center; }
  [data-theme="dark"] .ric { color: #b6bcc6; }
  .ric svg { width: 19px; height: 19px; }
  .rlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmeta { flex: none; font-size: 11.5px; color: var(--txt-2); font-family: ui-monospace, Consolas, monospace; }
  .chev { flex: none; width: 15px; height: 15px; color: var(--txt-3); }
  .sep { height: 1px; background: var(--line); margin: 4px 12px; }
  .row.danger { color: var(--red); }
  .row.danger .ric { color: var(--red); }
  .row.danger.click:hover { background: rgba(229, 72, 77, .08); }
  .empty { padding: 4px 14px 13px; font-size: 12px; color: var(--txt-3); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<main class="panel" id="panel">
  <div class="wrap" id="wrap">
    <header class="card head" id="headCard">
      <div class="logo" id="logoBox"></div>
      <div>
        <div class="head-name">NiceEnv</div>
        <div class="head-sub" id="headSub">本地开发环境</div>
      </div>
      <div class="head-status"><span class="dot" id="headDot"></span><span id="headStatus">—</span></div>
    </header>

    <section class="card quick" id="quickCard"></section>
    <section class="card" id="envCard"></section>
    <section class="card" id="navCard"></section>
  </div>
</main>

<script>
"use strict";

/* ================= 基建 ================= */

const TAURI = !!(window.__TAURI__ && window.__TAURI__.core);
const inv = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const svg = (inner, fill) =>
  `<svg viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

const ICONS = {
  logo: svg('<rect x="4" y="5" width="16" height="6" rx="2"/><rect x="4" y="13" width="16" height="6" rx="2"/><path d="M7.6 8h.01M7.6 16h.01"/>'),
  play: svg('<path d="M8 5.9v12.2c0 .8.88 1.29 1.56.86l9.9-6.1a1.02 1.02 0 0 0 0-1.72l-9.9-6.1A1.02 1.02 0 0 0 8 5.9z"/>', true),
  stop: svg('<rect x="6.4" y="6.4" width="11.2" height="11.2" rx="2.6"/>', true),
  refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
  window: svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9h17"/><path d="M6.6 6.8h.01M9.2 6.8h.01"/>'),
  globe: svg('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.3 3.8 5.2 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5.2-3.8-8.5s1.3-6.2 3.8-8.5z"/>'),
  db: svg('<ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-13"/><path d="M4.5 12c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3"/>'),
  code: svg('<path d="M8.5 7.5 4 12l4.5 4.5"/><path d="M15.5 7.5 20 12l-4.5 4.5"/>'),
  layers: svg('<path d="m12 3 8.5 4.8L12 12.6 3.5 7.8 12 3z"/><path d="m3.5 12.4 8.5 4.8 8.5-4.8"/><path d="m3.5 16.6 8.5 4.8 8.5-4.8"/>'),
  terminal: svg('<path d="m5 7 5 5-5 5"/><path d="M12.5 17H19"/>'),
  grid: svg('<rect x="3.5" y="3.5" width="7.4" height="7.4" rx="2"/><rect x="13.1" y="3.5" width="7.4" height="7.4" rx="2"/><rect x="3.5" y="13.1" width="7.4" height="7.4" rx="2"/><rect x="13.1" y="13.1" width="7.4" height="7.4" rx="2"/>'),
  pkg: svg('<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>'),
  file: svg('<path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8L14 3.5z"/><path d="M14 3.5V8h4.5"/><path d="M9 12.5h6M9 16h6"/>'),
  sliders: svg('<path d="M4 7h7.5M16.5 7H20"/><circle cx="14" cy="7" r="2.2"/><path d="M4 12h2.5M11.5 12H20"/><circle cx="9" cy="12" r="2.2"/><path d="M4 17h7.5M16.5 17H20"/><circle cx="14" cy="17" r="2.2"/>'),
  folder: svg('<path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17v-10.5z"/>'),
  info: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 7.6h.01"/>'),
  power: svg('<path d="M12 3.5v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>'),
  chev: svg('<path d="m9.5 6 6 6-6 6"/>'),
};
const GROUP_ICONS = [ICONS.globe, ICONS.code, ICONS.db, ICONS.layers, ICONS.terminal];

/* ================= 渲染 ================= */

let S = null;                 // tray_panel_state 的最新快照
const busy = new Set();       // 进行中的操作 key（行内转圈、防重复点击）

function theme() {
  const a = S && S.appearance;
  if (a === "dark" || a === "light") return a;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function render() {
  if (!S) return;
  document.documentElement.dataset.theme = theme();

  /* ---- 抬头 ---- */
  $("headSub").textContent = `v${S.version ?? "0.0.0"}`;
  const dot = $("headDot"), st = $("headStatus");
  if (S.total === 0) {
    dot.className = "dot"; st.textContent = "尚未安装服务";
  } else if (S.running > 0) {
    dot.className = "dot running"; st.textContent = `${S.running}/${S.total} 个服务运行中`;
  } else {
    dot.className = "dot"; st.textContent = `全部已停止（共 ${S.total} 个服务）`;
  }

  /* ---- 快捷宫格 ---- */
  const startable = (S.services || []).filter((s) => s.state !== "running" && s.state !== "starting").map((s) => s.id);
  const stoppable = (S.services || []).filter((s) => s.state === "running" || s.state === "starting");
  const qa = (id, icon, cap, on, busyKey) =>
    `<button class="qa${busy.has(busyKey) ? " busy" : ""}" id="${id}"${on ? "" : " disabled"}>
       ${icon}<span class="cap">${cap}</span>
     </button>`;
  $("quickCard").innerHTML =
    qa("qaStart", ICONS.play, "启动全部", startable.length > 0 && !busy.has("start-all"), "start-all") +
    qa("qaStop", ICONS.stop, "停止全部", stoppable.length > 0 && !busy.has("stop-all"), "stop-all") +
    qa("qaWindow", ICONS.window, "主窗口", true, "") +
    qa("qaUpdate", ICONS.refresh, "检查更新", true, "");

  /* ---- 环境卡：服务栈 / 服务 / 站点 ---- */
  let env = "";

  if ((S.stacks || []).length > 0) {
    env += `<div class="cap">服务栈</div>`;
    env += S.stacks.map((k) => {
      const key = "stack:" + k.id;
      const done = k.total > 0 && k.running >= k.total;
      return row({
        key, icon: ICONS.play, label: k.name,
        meta: k.total > 0 ? `${k.running}/${k.total} 运行中` : "",
        disabled: done || busy.has(key),
      });
    }).join("");
  }

  if ((S.services || []).length > 0) {
    if (env) env += `<div class="sep"></div>`;
    env += `<div class="cap">服务 · ${S.services.length}</div>`;
    let lastGroup = -1;
    for (const s of S.services) {
      if (lastGroup >= 0 && s.group !== lastGroup) env += `<div class="sep"></div>`;
      lastGroup = s.group;
      const key = "svc:" + s.id;
      const b = s.state === "starting" || s.state === "stopping" || busy.has(key);
      env += row({
        key,
        icon: GROUP_ICONS[s.group] || ICONS.terminal,
        label: s.label,
        meta: s.port ? `:${s.port}` : "",
        dot: b ? "busy" : s.state === "running" ? "running" : s.state === "error" ? "error" : "",
        disabled: false,
      });
    }
  } else if ((S.stacks || []).length === 0) {
    env += `<div class="empty">尚未安装任何服务，先到「套件 / 服务」安装。</div>`;
  }

  if ((S.sites || []).length > 0) {
    env += `<div class="sep"></div><div class="cap">站点 · ${S.sites.length}</div>`;
    env += S.sites.map((t) => row({
      key: "site:" + t.id, icon: ICONS.globe, label: t.name,
      meta: t.url.replace(/^https?:\/\//, ""), chev: true,
    })).join("");
  }
  $("envCard").innerHTML = env || `<div class="empty">加载中…</div>`;

  /* ---- 导航 + 应用卡 ---- */
  const nav = (path, icon, label) => row({ key: "nav:" + path, icon, label, chev: true });
  $("navCard").innerHTML =
    nav("/", ICONS.grid, "总览") +
    nav("/packages", ICONS.pkg, "套件 / 服务") +
    nav("/stacks", ICONS.layers, "服务栈") +
    nav("/sites", ICONS.globe, "站点") +
    nav("/logs", ICONS.file, "日志") +
    `<div class="sep"></div>` +
    row({ key: "act:datadir", icon: ICONS.folder, label: "打开数据目录" }) +
    row({ key: "act:about", icon: ICONS.info, label: "关于 NiceEnv" }) +
    row({ key: "act:quit", icon: ICONS.power, label: "退出 NiceEnv", danger: true });

  bind();
  requestAnimationFrame(syncHeight);
}

function row(o) {
  const cls = ["row", o.disabled ? "disabled" : o.danger ? "danger click" : o.key ? "click" : ""].filter(Boolean).join(" ");
  const dot = o.dot ? `<span class="dot ${o.dot}"></span>` : "";
  const chev = o.chev ? `<span class="chev">${ICONS.chev}</span>` : "";
  return `<div class="${cls}" data-key="${esc(o.key || "")}">
    <span class="ric">${o.icon}</span>
    <span class="rlabel">${esc(o.label)}</span>
    ${o.meta ? `<span class="rmeta">${esc(o.meta)}</span>` : ""}
    ${dot}${chev}
  </div>`;
}

/* ================= 交互 ================= */

function bind() {
  $("headCard").onclick = () => act("main");
  $("qaStart").onclick = () => act("start-all");
  $("qaStop").onclick = () => act("stop-all");
  $("qaWindow").onclick = () => act("main");
  $("qaUpdate").onclick = () => act("check-update");
  for (const el of document.querySelectorAll("[data-key]")) {
    const key = el.dataset.key;
    if (!key) continue;
    el.onclick = () => act(key);
  }
}

async function act(key) {
  if (key === "main") return TAURI ? inv("tray_open_main", { path: null, action: null }) : mock("打开主窗口");
  if (key === "check-update") return TAURI ? inv("tray_open_main", { path: null, action: "check-update" }) : mock("检查更新");

  if (key === "start-all") {
    const ids = (S?.services || []).filter((s) => s.state !== "running" && s.state !== "starting").map((s) => s.id);
    if (!ids.length) return;
    busy.add("start-all"); render();
    if (TAURI) { try { await inv("bulk_start", { ids }); } catch (e) { console.error(e); } await refreshState(); }
    else { await mock("启动全部"); S.services.forEach((s) => (s.state = "running")); await refreshState(); }
    busy.delete("start-all"); render();
    return;
  }
  if (key === "stop-all") {
    busy.add("stop-all"); render();
    if (TAURI) inv("tray_stop_all", {});
    else { await mock("停止全部"); S.services.forEach((s) => (s.state = "stopped")); await refreshState(); }
    return; // 完成后由 tray://state 事件刷新并清掉 busy
  }

  if (key.startsWith("svc:")) {
    const id = key.slice(4);
    const s = (S?.services || []).find((x) => x.id === id);
    if (!s || busy.has(key)) return;
    const target = s.state === "running" || s.state === "starting" ? "stop_service" : "start_service";
    busy.add(key); render();
    if (TAURI) { try { await inv(target, { id }); } catch (e) { console.error(e); } }
    else { await mock(target); s.state = target === "start_service" ? "running" : "stopped"; }
    busy.delete(key); await refreshState();
    return;
  }
  if (key.startsWith("stack:")) {
    const id = key.slice(6);
    if (busy.has(key)) return;
    busy.add(key); render();
    if (TAURI) { try { await inv("start_stack", { id }); } catch (e) { console.error(e); } await refreshState(); }
    else { await mock("启动服务栈"); await refreshState(); }
    busy.delete(key); render();
    return;
  }
  if (key.startsWith("site:")) {
    const t = (S?.sites || []).find((x) => "site:" + x.id === key);
    if (TAURI) inv("open_in_browser", { url: t.url });
    else mock("打开 " + t.url);
    return;
  }
  if (key.startsWith("nav:")) {
    const path = key.slice(4);
    if (TAURI) inv("tray_open_main", { path, action: null });
    else mock("跳转 " + path);
    return;
  }
  if (key === "act:datadir") {
    if (TAURI) inv("open_in_folder", { path: S.dataDir });
    else mock("打开数据目录 " + S.dataDir);
    return;
  }
  if (key === "act:about") {
    if (TAURI) inv("tray_open_main", { path: null, action: "about" });
    else mock("关于");
    return;
  }
  if (key === "act:quit") {
    if (TAURI) inv("quit_app", {});
    else mock("退出");
    return;
  }
}

async function refreshState() {
  if (!TAURI) { // mock：S 已就地改过，重算汇总字段后重渲染
    S.running = (S.services || []).filter((s) => s.state === "running").length;
    render();
    return;
  }
  try { S = await inv("tray_panel_state", {}); render(); } catch (e) { console.error(e); }
}

/* 高度自适应：内容多高窗口就多高（上限 680，超了在面板内滚动） */
function syncHeight() {
  if (!TAURI) return;
  const h = Math.ceil($("wrap").getBoundingClientRect().height) + 16;
  inv("tray_panel_resize", { height: h }).catch(() => {});
}

/* ================= 启动 ================= */

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && TAURI) inv("tray_panel_hide", {});
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

$("logoBox").innerHTML = ICONS.logo;

if (TAURI) {
  refreshState();
  window.__TAURI__.event.listen("tray://state", (e) => {
    S = e.payload;
    busy.clear();
    render();
  });
} else {
  /* ---- 浏览器 mock 预览（#demo=quiet | busy | dark） ---- */
  const q = new URLSearchParams(location.hash.replace(/^#\??/, ""));
  const svc = (id, label, state, group, port) => ({ id, label, state, group, port });
  S = {
    version: "0.1.0",
    appearance: q.get("demo") === "dark" ? "dark" : "light",
    running: q.get("demo") === "busy" ? 5 : 0,
    total: q.get("demo") === "busy" ? 6 : 1,
    dataDir: "D:\\ServBay\\data",
    services: q.get("demo") === "busy"
      ? [svc("nginx", "Nginx", "running", 0, 80), svc("apache", "Apache", "stopped", 0, 8080),
