name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-15-intel, macos-latest] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - name: Native command coverage
        shell: bash
        env: { NICEENV_WAILS_HOME: "${{ runner.temp }}/niceenv-wails" }
        run: node scripts/wails-port-status.mjs --require-complete

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nsb/schema check
      - run: pnpm --filter @nsb/web check
      - run: pnpm --filter @nsb/web check:logic
      - run: pnpm --filter @nsb/web build
      - uses: actions/upload-artifact@v5
        with: { name: web-static-export, path: apps/web/out, if-no-files-found: error }
